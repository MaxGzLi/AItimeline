name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:unit
      - name: Pack-consumer smoke
        run: |
          pack_dir="$(mktemp -d)"
          consumer_dir="$(mktemp -d)"
          trap 'rm -rf "$pack_dir" "$consumer_dir"' EXIT

          rm -rf packages/core/dist
          npm pack -w @aitimeline/core --pack-destination "$pack_dir"

          (
            cd "$consumer_dir"
            npm init -y >/dev/null
            npm install "$pack_dir"/*.tgz
            node --input-type=module -e "const m = await import('@aitimeline/core'); if (typeof m.createSourceRegistry !== 'function') throw new Error('missing export'); console.log('pack-consumer import passed');"
          )
      - run: npm run smoke:core
      - run: npm run smoke:api
      - run: npm run smoke:model
      - run: npm run smoke:mcp
      - run: npm run smoke:agent
