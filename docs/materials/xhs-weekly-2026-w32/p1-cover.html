<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="shared.css">
<style>
  .cover-issue {
    margin-top: 40px;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
  }
  .cover-issue .issue-tag {
    font-family: "Smiley";
    font-size: 26px;
    color: #B3402A;
    letter-spacing: 0.1em;
  }
  .cover-issue .date {
    font-family: "Smiley";
    font-size: 24px;
    color: #6B6A66;
  }
  .cover-title {
    margin-top: 26px;
    font-family: "Huangyou";
    font-size: 108px;
    line-height: 1.14;
    letter-spacing: -0.03em;
  }
  .cover-title .en {
    font-size: 100px;
    letter-spacing: 0;
  }
  .cover-count {
    margin-top: 30px;
    font-size: 26px;
    line-height: 1.7;
    color: #2B2A26;
  }
  .cover-count .num {
    font-size: 44px;
    color: #B3402A;
    margin: 0 4px;
  }
  /* 目录格:真序列,对应内页页码 */
  .toc {
    margin-top: 52px;
    border-top: 3px solid #1C1B18;
  }
  .toc-row {
    display: flex;
    align-items: baseline;
    gap: 26px;
    padding: 25px 6px 23px;
    border-bottom: 1.5px solid #C9C7BF;
  }
  .toc-row .no {
    font-family: "Smiley";
    font-size: 34px;
    color: #B3402A;
    width: 56px;
  }
  .toc-row .t {
    font-family: "SourceHeavy";
    font-size: 31px;
    letter-spacing: 0.02em;
  }
  .toc-row .t .en { font-size: 30px; }
  .toc-row .tag {
    margin-left: auto;
    font-family: "Wenkai";
    font-size: 17px;
    color: #8A8880;
  }
</style>
</head>
<body>
<div class="page">
  <div class="masthead">
    <div class="brand"><span>AITIMELINE</span><b>知识周报</b></div>
    <div class="pageno">01 / 06</div>
  </div>

  <div class="cover-issue">
    <div class="issue-tag">ISSUE 01</div>
    <div class="date">2026.08.03 — 08.09</div>
  </div>

  <div class="cover-title">这周摸鱼刷 <span class="en">X</span>，<br>捞回一沓知识卡</div>

  <div class="cover-count">
    本周新攒 <span class="num">16</span> 张卡，其中 <span class="num">9</span> 张是刷推时顺手存下的。
  </div>

  <div class="toc">
    <div class="toc-row">
      <div class="no">02</div>
      <div class="t">MiniMax H3 的「开源」协议</div>
      <div class="tag">深读</div>
    </div>
    <div class="toc-row">
      <div class="no">03</div>
      <div class="t"><span class="en">671B</span> 参数，为何只激活 <span class="en">37B</span></div>
      <div class="tag">硬核</div>
    </div>
    <div class="toc-row">
      <div class="no">04</div>
      <div class="t">全球 <span class="en">LLM</span> 版图</div>
      <div class="tag">盘点</div>
    </div>
    <div class="toc-row">
      <div class="no">05</div>
      <div class="t">AI 批改作业，教室里先跑起来了</div>
      <div class="tag">落地</div>
    </div>
    <div class="toc-row">
      <div class="no">06</div>
      <div class="t">本周数字备忘</div>
      <div class="tag">收藏</div>
    </div>
  </div>

  <div class="transition">
    <div class="q">先从这周开源圈吵得最凶的一条说起。</div>
    <div class="next">下一页 <span class="en">→ 02</span> · MiniMax H3</div>
  </div>
</div>
</body>
</html>
