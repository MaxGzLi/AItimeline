<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="shared.css">
<style>
  .kicker { background: var(--pu-bg); color: var(--pu-fg); }
  .steps { margin-top: 30px; display: flex; flex-direction: column; gap: 14px; }
  .step { display: flex; align-items: baseline; gap: 28px; border-radius: 26px; padding: 20px 34px; }
  .step .no { font-family: "Huangyou"; font-size: 50px; }
  .step .t { font-size: 38px; }
  .step .d { display: block; margin-top: 8px; font-family: "SourceLight"; font-size: 25px; line-height: 1.5; }
  .qcard { margin-top: 20px; }
  .qcard .q-body { font-size: 26px; }
  .strip { margin-top: 18px; font-size: 32px; padding: 22px 32px; }
</style>
</head>
<body>
<div class="head">
  <div class="badge">AI 知识周报</div>
  <div class="pgno">05 / 06</div>
</div>

<div><span class="kicker">落地 / 教育现场</span></div>
<div class="title" style="font-size:72px;">AI 批改作业，<br>从<span class="red">扫描到反馈</span></div>

<div class="steps">
  <div class="step c-or">
    <span class="no">01</span>
    <div><span class="t">扫描笔记本</span><span class="d">纸面作业直接进系统，不用学生誊录、不用老师拍照</span></div>
  </div>
  <div class="step c-bl">
    <span class="no">02</span>
    <div><span class="t">自动评分</span><span class="d">批改任务由 AI 完成，老师从重复劳动里退出来</span></div>
  </div>
  <div class="step c-gr">
    <span class="no">03</span>
    <div><span class="t">打印反馈</span><span class="d">结果落回纸面，错在哪里直接标给学生看</span></div>
  </div>
</div>

<div class="qcard">
  <div class="lab">剪藏原文 / 中译</div>
  <div class="q-body">在中国学校里，人工智能现在通过扫描笔记本来批改作业，自动评分任务，并打印出反馈，突出显示错误。</div>
  <div class="q-src">@Rainmaker1973 / X / 2026.08.04</div>
</div>

<div class="strip">单看每一步都不新鲜，串成流水线才是新闻</div>

<div class="bar">
  <div class="q">刷了一周、存了一沓；这些东西都记在哪？</div>
  <div class="next">下一页 → 06</div>
</div>
</body>
</html>
